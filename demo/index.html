<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>skycake demo</title>
<link rel="stylesheet" href="../style.css">
<style>
  body { margin: 0; padding: 16px; background: #17191c; color: #d9dadc; font-family: system-ui, sans-serif; }
  @media (max-width: 860px) { body { padding: 0; } }
</style>
<script type="importmap">
{
  "imports": { "three": "/node_modules/three/build/three.module.js", "three/examples/jsm/": "/node_modules/three/examples/jsm/", "/dist/viewer.js": "/demo/viewer.js" },
  "scopes": { "/demo/": { "/dist/viewer.js": "/dist/viewer.js" } }
}
</script>
</head>
<body>
<div id="v"></div>
<script type="module">
  import { mount } from "../dist/index.js";
  // ?scene={...} shows that scene first, for checking. ?walkthrough=class-b plays demo/class-b.json. ?quiz=class-b asks
  // demo/class-b-quiz.json; ?quiz=practice practises, with optional kinds, types and airports (comma lists).
  // Quiz results go to the console. The view is window.v (demo/viewer.js), e.g. v.timeline(0.5).
  const q = new URLSearchParams(location.search);
  const scene = q.get("scene");
  const walkthrough = q.get("walkthrough");
  const quiz = q.get("quiz");
  const list = (k) => q.get(k)?.split(",");
  const json = (name) => fetch(`./${encodeURIComponent(name)}.json`).then((r) => r.json());
  const mode = quiz
    ? { quiz: quiz === "practice" ? "practice" : await json(`${quiz}-quiz`), kinds: list("kinds"), types: list("types"), airports: list("airports") }
    : walkthrough ? { walkthrough: await json(walkthrough), next: { label: "Quiz", href: "./?quiz=class-b" } } : "explore";
  // ?a11y=1 or ?a11y=0: the site drives accessibility mode; left out, skycake shows its own switch in free roam.
  const a11y = q.get("a11y");
  mount(document.querySelector("#v"), { base: "/data/phoenix/", mode, onResult: (r) => console.log("skycake result", r), ...(scene ? { scene: JSON.parse(scene) } : {}), ...(a11y !== null ? { a11y: a11y === "1" } : {}) });
</script>
</body>
</html>
