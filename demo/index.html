<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>skycake demo</title>
<link rel="stylesheet" href="../style.css">
<style>
  body { margin: 0; padding: 16px; background: #17191c; color: #d9dadc; font-family: system-ui, sans-serif; }
  @media (max-width: 860px) { body { padding: 0; } }
</style>
<script type="importmap">
{
  "imports": { "three": "/node_modules/three/build/three.module.js", "three/examples/jsm/": "/node_modules/three/examples/jsm/", "/dist/viewer.js": "/demo/viewer.js" },
  "scopes": { "/demo/": { "/dist/viewer.js": "/dist/viewer.js" } }
}
</script>
</head>
<body>
<div id="v"></div>
<script type="module">
  import { mount } from "../dist/index.js";
  // ?scene={...} shows that scene first, for checking. ?walkthrough=class-b plays demo/class-b.json.
  // The view is window.v (demo/viewer.js), e.g. v.timeline(0.5).
  const q = new URLSearchParams(location.search);
  const scene = q.get("scene");
  const walkthrough = q.get("walkthrough");
  const mode = walkthrough ? { walkthrough: await fetch(`./${encodeURIComponent(walkthrough)}.json`).then((r) => r.json()), next: { label: "Quiz", href: "./" } } : "explore";
  mount(document.querySelector("#v"), { base: "/data/phoenix/", mode, ...(scene ? { scene: JSON.parse(scene) } : {}) });
</script>
</body>
</html>
