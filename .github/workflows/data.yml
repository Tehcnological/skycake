name: Data cycle

# The FAA publishes new procedures every 28 days and new charts every 56, effective at 0901Z. Once a day this checks
# whether a new 28-day cycle is in effect and, if so, rebuilds data/ and opens a PR. Merging it ships the data to the
# sites (from git) and to SkyCake Viewer (deploy.yml, after CI passes on main). See "Data" in README.md.
# Two jobs: build runs npm ci and the data build (and so every dependency and every FAA and USGS download) with a
# read-only token; open-pr holds the write token and runs only git and gh on the built files. No secrets.
on:
  schedule:
    - cron: "30 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-cycle
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90 # a clean charts build (529 d-TPP PDFs) has not been timed; this bounds a hung job
    permissions:
      contents: read
    outputs:
      cycle: ${{ steps.cycle.outputs.cycle }}
      due: ${{ steps.cycle.outputs.due }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Due when the committed data is from an older cycle and no PR branch for this one exists yet.
      - name: New cycle?
        id: cycle
        run: |
          cycle=$(npx tsx scripts/build-area.ts --cycle)
          echo "cycle=$cycle" >> "$GITHUB_OUTPUT"
          for a in data/*/area.json; do
            if [ "$(jq -r '.cycle // ""' "$a")" != "$cycle" ]; then due=1; fi
          done
          if [ -n "$due" ] && ! git ls-remote --exit-code origin "refs/heads/data/$cycle" > /dev/null; then
            echo "due=1" >> "$GITHUB_OUTPUT"
            echo "Cycle $cycle: rebuilding."
          else
            echo "Cycle $cycle: nothing to do."
          fi

      - name: Build the data
        if: steps.cycle.outputs.due
        shell: bash
        run: npm run data 2>&1 | tee data.log

      - name: Data files fit Cloudflare
        if: steps.cycle.outputs.due
        run: |
          if find data -type f -size +24M | grep .; then
            echo "::error::Data files above are over 24 MiB. Keep each one well under 25 MiB."
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.cycle.outputs.due
        with:
          name: data
          path: |
            data/
            data.log
          retention-days: 3

  open-pr:
    needs: build
    if: needs.build.outputs.due
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Push the branch, open the PR, start CI on it. Nothing else runs here: no npm, no repo scripts.
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: data
          path: ${{ runner.temp }}/built

      # Only data/ and the log are taken from the build; nothing else it might have packed reaches the checkout.
      - name: Take the built data
        run: |
          test -d "$RUNNER_TEMP/built/data"
          rm -rf data
          cp -R "$RUNNER_TEMP/built/data" data
          cp "$RUNNER_TEMP/built/data.log" "$RUNNER_TEMP/data.log"

      - name: Open a PR
        env:
          GH_TOKEN: ${{ github.token }}
          CYCLE: ${{ needs.build.outputs.cycle }}
        run: |
          case "$CYCLE" in [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;; *) echo "::error::odd cycle $CYCLE"; exit 1 ;; esac
          branch="data/$CYCLE"
          git switch -c "$branch"
          git add data
          if git diff --cached --quiet; then echo "No data changes."; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Data for the $CYCLE cycle"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" "$branch"
          {
            echo "FAA data for the cycle effective $CYCLE, built by the Data cycle workflow. Check the notes below, then merge."
            echo
            echo '```'
            grep -E "left out|ticks fit|charts|with no|airports|IAP|SID|STAR|^[A-Z]+ [0-9]+," "$RUNNER_TEMP/data.log" || true
            echo '```'
            echo
            git diff --stat HEAD~1 | tail -1
          } > "$RUNNER_TEMP/body.md"
          gh pr create --base main --head "$branch" --title "Data: $CYCLE cycle" --body-file "$RUNNER_TEMP/body.md"
          # A PR opened with this workflow's token starts no other workflows, so start CI on the branch here.
          gh workflow run ci.yml --ref "$branch"
