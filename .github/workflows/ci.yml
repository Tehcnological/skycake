name: CI

# No path filters: a required check that never starts leaves its PR stuck waiting. See "CI" in README.md.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to a PR cancels that PR's older run. Main keeps a result for every commit.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22 # the floor in package.json engines
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Sites install this commit from GitHub without building, so dist/ has to match src/.
      - name: Committed dist/ is current
        run: |
          rm -rf dist
          npm run build
          git add -N .
          git diff --exit-code --stat || { echo "::error::dist/ does not match src/. Run npm run build and commit dist/."; exit 1; }

      # CLAUDE.md: sites run on Cloudflare's free tier, so each data file stays well under 25 MiB.
      - name: Data files fit Cloudflare
        run: |
          if find data -type f -size +24M | grep .; then
            echo "::error::Data files above are over 24 MiB. Keep each one well under 25 MiB."
            exit 1
          fi

      # SkyCake Viewer, the standalone web app: Cloudflare runs npm run app and serves www/. Its own asserts check the
      # data manifest and the service worker's file list.
      - name: App builds
        run: |
          npm run app
          test -f www/index.html
          test -f www/sw.js
          test -f www/data/phoenix/area.json

      - name: Installs from git the way a site does
        run: |
          cd "$(mktemp -d)"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "git+file://$GITHUB_WORKSPACE#$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
          node --input-type=module -e "const { mount } = await import('skycake'); if (typeof mount !== 'function') throw new Error('skycake does not export mount');"
          test -f node_modules/skycake/style.css
          test -f node_modules/three/package.json
          test -d node_modules/skycake/data/phoenix
