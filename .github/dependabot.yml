# Keeps the actions in .github/workflows/ current, majors included, as commit pins, and the deploy step's wrangler
# lockfile (.github/deploy). npm security updates are on in the repo settings.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /.github/deploy
    schedule:
      interval: monthly
